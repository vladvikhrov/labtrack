# Запуск: docker compose up -d --build
services:
  web:
    build: .
    env_file: .env
    environment:
      SESSION_COOKIE_SECURE: "1"
      PUBLIC_BASE_URL: "https://${DOMAIN}/"
    volumes:
      - labtrack-data:/data
    restart: unless-stopped

  caddy:  # обратный прокси с автоматическим HTTPS-сертификатом Let's Encrypt
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  labtrack-data:
  caddy-data:
  caddy-config:
